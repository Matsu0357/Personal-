<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "NotoJP"; font-weight: 500; src: url("assets/NotoSansJP-500.ttf"); }
  @font-face { font-family: "NotoJP"; font-weight: 900; src: url("assets/NotoSansJP-900.ttf"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// ガスライティング解説のレンダラー（Inspire and Thrive 型：黒地・白い棒人間・キーワードだけ赤）
const W = 1280, H = 720;
const cv = document.getElementById("c");
const g = cv.getContext("2d");
const C = { bg: "#000", white: "#f5f5f2", grey: "#9aa0aa", red: "#ff3b3b", dim: "#5b606a", warm: "#ffd27a", ink: "#000" };
let TL = null;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;

function sceneAt(t) { for (const s of TL.scenes) if (t >= s.start && t < s.end) return s; return TL.scenes[TL.scenes.length - 1]; }
function lineAt(s, t) { let i = -1; s.lines.forEach((l, k) => { if (t >= l.start) i = k; }); return i; }
function since(s, i, t) { return s.lines[i] ? t - s.lines[i].start : -1; }
function fadeIn(s, i, t, d = 0.4) { return i >= 0 && s.lines[i] ? ease(since(s, i, t) / d) : 0; }

// ---------- 部品 ----------
function rrect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function text(str, x, y, size, color, weight = 900, align = "center") {
  g.font = `${weight} ${size}px NotoJP`; g.fillStyle = color; g.textAlign = align; g.textBaseline = "middle";
  g.fillText(str, x, y);
}
// 見出し：key の部分だけ赤
function title(str, key, x, y, size, a = 1) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.font = `900 ${size}px NotoJP`; g.textBaseline = "middle";
  const parts = key && str.includes(key) ? [str.slice(0, str.indexOf(key)), key, str.slice(str.indexOf(key) + key.length)] : [str, "", ""];
  const w = parts.reduce((s, p) => s + g.measureText(p).width, 0);
  let cx = x - w / 2;
  parts.forEach((p, k) => { g.fillStyle = k === 1 ? C.red : C.white; g.textAlign = "left"; g.fillText(p, cx, y); cx += g.measureText(p).width; });
  g.restore();
}
// 棒人間。pose: stand / bow / shrink / point / think / write / phone / slump / open
function figure(x, y, s, o = {}) {
  const col = o.color || C.white, pose = o.pose || "stand", t = o.t || 0;
  g.save(); g.translate(x, y); g.scale(s * (o.flip ? -1 : 1), s);
  g.globalAlpha = o.alpha ?? 1;
  g.strokeStyle = col; g.fillStyle = col; g.lineCap = "round"; g.lineJoin = "round";
  const breathe = Math.sin(t * 2) * 2;
  let hx = 0, hy = -205 + breathe, neck = [0, -170], hip = [0, -80];
  if (pose === "bow") { hx = 45; hy = -160; neck = [30, -140]; }
  if (pose === "shrink" || pose === "slump") { hx = 8; hy = -190; neck = [4, -158]; }
  // 胴体
  g.lineWidth = 26; g.beginPath(); g.moveTo(...neck); g.lineTo(...hip); g.stroke();
  // 脚
  g.lineWidth = 18; g.beginPath(); g.moveTo(...hip); g.lineTo(-22, 0); g.moveTo(...hip); g.lineTo(22, 0); g.stroke();
  // 腕
  g.beginPath();
  const sh = [neck[0], neck[1] + 12];
  if (pose === "point") { g.moveTo(...sh); g.lineTo(70, -150); g.lineTo(115, -160); g.moveTo(...sh); g.lineTo(-20, -90); }
  else if (pose === "bow") { g.moveTo(...sh); g.lineTo(55, -95); g.moveTo(...sh); g.lineTo(40, -95); }
  else if (pose === "shrink") { g.moveTo(...sh); g.lineTo(30, -120); g.lineTo(20, -175); g.moveTo(...sh); g.lineTo(-25, -120); g.lineTo(-10, -170); }
  else if (pose === "think") { g.moveTo(...sh); g.lineTo(35, -110); g.lineTo(28, -175); g.moveTo(...sh); g.lineTo(-25, -95); }
  else if (pose === "write" || pose === "phone") { g.moveTo(...sh); g.lineTo(45, -115); g.lineTo(80, -125); g.moveTo(...sh); g.lineTo(35, -105); g.lineTo(70, -110); }
  else if (pose === "open") { g.moveTo(...sh); g.lineTo(60, -175); g.moveTo(...sh); g.lineTo(-60, -175); }
  else if (pose === "slump") { g.moveTo(...sh); g.lineTo(18, -75); g.moveTo(...sh); g.lineTo(-18, -75); }
  else { g.moveTo(...sh); g.lineTo(30, -90); g.moveTo(...sh); g.lineTo(-30, -90); }
  g.stroke();
  // 頭
  g.beginPath(); g.arc(hx, hy, 38, 0, Math.PI * 2); g.fill();
  if (o.hair) { g.beginPath(); g.ellipse(hx - 30, hy - 10, 14, 30, 0.5, 0, Math.PI * 2); g.fill(); }
  // 顔（右向き）
  g.fillStyle = C.ink;
  const ey = hy - 4;
  if (o.mood === "happy") { g.lineWidth = 4; g.strokeStyle = C.ink; g.beginPath(); g.arc(hx + 6, ey, 5, Math.PI, 0); g.arc(hx + 24, ey, 5, Math.PI, 0); g.stroke(); g.beginPath(); g.arc(hx + 15, hy + 10, 9, 0.2, Math.PI - 0.2); g.stroke(); }
  else { g.beginPath(); g.arc(hx + 6, ey, 4.5, 0, Math.PI * 2); g.arc(hx + 24, ey, 4.5, 0, Math.PI * 2); g.fill(); }
  if (o.mood === "worried") { g.lineWidth = 3.5; g.strokeStyle = C.ink; g.beginPath(); g.moveTo(hx, ey - 12); g.lineTo(hx + 10, ey - 15); g.moveTo(hx + 30, ey - 12); g.lineTo(hx + 20, ey - 15); g.stroke(); }
  if (o.mood === "stern") { g.lineWidth = 4; g.strokeStyle = C.ink; g.beginPath(); g.moveTo(hx, ey - 16); g.lineTo(hx + 11, ey - 10); g.moveTo(hx + 30, ey - 16); g.lineTo(hx + 19, ey - 10); g.stroke(); }
  g.restore();
  // 「!?」と汗
  if (o.marks) {
    const a = 0.6 + 0.4 * Math.sin(t * 6);
    g.globalAlpha = a; text("!?", x + 55 * s, y - 280 * s, 44 * s, C.white); g.globalAlpha = 1;
    g.strokeStyle = C.white; g.lineWidth = 4;
    for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(x - 20 * s, y - 210 * s, (55 + k * 12) * s, -2.3 - k * 0.05, -1.9); g.stroke(); }
  }
}
function bubble(str, x, y, size = 30, a = 1, tail = "left", col = C.white, txt = C.ink) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  g.font = `900 ${size}px NotoJP`;
  const w = g.measureText(str).width + size * 1.4, h = size * 2;
  g.fillStyle = col; rrect(x - w / 2, y - h / 2, w, h, h / 2.2); g.fill();
  g.beginPath();
  const tx = tail === "left" ? x - w / 4 : x + w / 4;
  g.moveTo(tx - 12, y + h / 2 - 2); g.lineTo(tx + (tail === "left" ? -26 : 26), y + h / 2 + 26); g.lineTo(tx + 14, y + h / 2 - 2); g.fill();
  text(str, x, y + 1, size, txt);
  g.restore();
}
function thought(x, y, r, a = 1) {
  g.save(); g.globalAlpha = a; g.fillStyle = C.white;
  g.beginPath(); g.ellipse(x, y, r * 1.3, r, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(x - r * 0.9, y + r * 1.15, r * 0.18, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(x - r * 1.2, y + r * 1.5, r * 0.1, 0, Math.PI * 2); g.fill();
  g.restore();
}
function heart(x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col;
  g.beginPath(); g.moveTo(0, 30); g.bezierCurveTo(-60, -10, -30, -60, 0, -28); g.bezierCurveTo(30, -60, 60, -10, 0, 30); g.fill(); g.restore();
}
function arrow(x1, y1, x2, y2, col = C.red, a = 1) {
  g.save(); g.globalAlpha = a; g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 8; g.lineCap = "round";
  g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo((x1 + x2) / 2 + 40, (y1 + y2) / 2 - 40, x2, y2); g.stroke();
  const an = Math.atan2(y2 - y1, x2 - x1);
  g.beginPath(); g.moveTo(x2, y2); g.lineTo(x2 - 26 * Math.cos(an - 0.5), y2 - 26 * Math.sin(an - 0.5)); g.lineTo(x2 - 26 * Math.cos(an + 0.5), y2 - 26 * Math.sin(an + 0.5)); g.fill();
  g.restore();
}
function floor() { g.fillStyle = "#0d0e11"; g.fillRect(0, 600, W, 120); }
function subtitle(s, t) {
  const i = lineAt(s, t); if (i < 0) return;
  const l = s.lines[i]; if (t > l.end + 0.3) return;
  g.save();
  g.font = "500 34px NotoJP"; g.textAlign = "center"; g.textBaseline = "middle";
  // 長い行は、真ん中に近い「。」か「、」で2行に分ける
  let rows = [l.text];
  if (g.measureText(l.text).width > W - 120) {
    const mid = l.text.length / 2;
    let cut = -1;
    [...l.text].forEach((ch, k) => { if ((ch === "。" || ch === "、" || ch === "」") && k < l.text.length - 1 && (cut < 0 || Math.abs(k - mid) < Math.abs(cut - mid))) cut = k; });
    if (cut < 0) cut = Math.floor(mid) - 1;
    rows = [l.text.slice(0, cut + 1), l.text.slice(cut + 1)];
  }
  const w = Math.min(W - 40, Math.max(...rows.map(r => g.measureText(r).width)));
  const h = rows.length * 46 + 14, top = H - 34 - h;
  g.fillStyle = "rgba(0,0,0,0.75)"; rrect(W / 2 - w / 2 - 20, top, w + 40, h, 10); g.fill();
  g.fillStyle = C.white;
  rows.forEach((r, k) => g.fillText(r, W / 2, top + 30 + k * 46, W - 60));
  g.restore();
}
function card(s, t) {
  if (!s.card) return false;
  const p = (t - s.start) / 2.2;
  if (p >= 1) return false;
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const a = ease(p * 4) * (1 - ease((p - 0.82) * 6));
  g.globalAlpha = a; text(`サイン ${s.num}`, W / 2, 270, 46, C.red); g.globalAlpha = 1;
  title(s.big, s.key, W / 2, 370, 76, a);
  return true;
}
function header(s, t) { if (s.big) title(s.big, s.key, W / 2, 78, 54, 1); if (s.num) text(s.num, 70, 78, 54, C.red); }

// ---------- シーン ----------
const S = {
  intro(s, t) {
    const i = lineAt(s, t);
    floor();
    figure(400, 600, 1, { t, pose: i >= 0 ? "point" : "stand", color: C.grey, hair: true, mood: "stern" });
    figure(840, 600, i >= 3 ? 0.9 : 1, { t, pose: i >= 3 ? "shrink" : "stand", flip: true, mood: "worried", marks: i >= 0 });
    const dim = i <= 2 ? 1 : 0.35;
    bubble("え、そんなこと言ってないけど？", 470, 300, 30, fadeIn(s, 0, t) * dim);
    bubble("また被害妄想？", 560, 215, 30, fadeIn(s, 1, t) * dim);
    bubble("普通、そんなことで怒らないよ", 500, 130, 30, fadeIn(s, 2, t) * dim);
    if (i >= 3 && i < 5) { thought(980, 200, 80, fadeIn(s, 3, t)); g.globalAlpha = fadeIn(s, 3, t); text("わたしが", 980, 180, 24, C.ink); text("おかしいのかな", 980, 215, 24, C.ink); g.globalAlpha = 1; }
    if (i >= 5) {
      g.fillStyle = `rgba(0,0,0,${0.75 * fadeIn(s, 5, t)})`; g.fillRect(0, 0, W, H);
      text("モラハラの手口のひとつ", W / 2, 250, 40, C.grey, 900);
      title("それ、ガスライティングかも", "ガスライティング", W / 2, 340, 80, fadeIn(s, 5, t));
    }
  },
  what(s, t) {
    const i = lineAt(s, t);
    if (i <= 1) {
      floor();
      figure(640, 600, 1, { t, pose: "think", mood: "worried" });
      thought(820, 230, 95, fadeIn(s, 0, t));
      g.globalAlpha = fadeIn(s, 0, t); text("わたしの記憶", 820, 210, 30, C.ink); text("わたしの気持ち", 820, 255, 30, C.ink); g.globalAlpha = 1;
      if (i >= 0) { g.globalAlpha = fadeIn(s, 0, t, 1.5); g.strokeStyle = C.red; g.lineWidth = 10; g.beginPath(); g.moveTo(710, 180); g.lineTo(930, 285); g.stroke(); g.globalAlpha = 1; }
      if (i >= 1) title("「おかしいのは自分のほうだ」", "自分", W / 2, 90, 52, fadeIn(s, 1, t));
    } else if (i === 2) {
      // どんな関係でも起こる
      floor();
      title("立場に差がある関係なら、どこでも", "どこでも", W / 2, 90, 46, fadeIn(s, 2, t, 0.6));
      ["夫婦・恋人", "職場の上司", "親", "友だち"].forEach((lab, k) => {
        const a = ease((t - s.lines[2].start - k * 0.7) / 0.5), x = 200 + k * 293;
        figure(x - 45, 560, 0.62, { t, pose: "point", color: C.grey, hair: k % 2 === 0, mood: "stern", alpha: a });
        figure(x + 55, 560, 0.5, { t, pose: "shrink", flip: true, mood: "worried", alpha: a });
        g.globalAlpha = a; text(lab, x, 250, 32, C.white); g.globalAlpha = 1;
      });
    } else if (i === 3) {
      floor();
      figure(640, 600, 1, { t, pose: "shrink", mood: "worried" });
      bubble("波風を立てたくない", 420, 220, 32, fadeIn(s, 3, t), "right");
      bubble("自分が我慢すれば…", 880, 300, 32, fadeIn(s, 3, t, 1.6), "left");
      title("やさしい人ほど、気づきにくい", "気づきにくい", W / 2, 90, 48, fadeIn(s, 3, t, 2.5));
    } else if (i === 4) {
      floor();
      const a = fadeIn(s, 4, t);
      figure(440, 600, 1.15, { t, pose: "point", color: C.grey, hair: true, mood: "stern" });
      figure(820, 600, 0.75, { t, pose: "shrink", flip: true, mood: "worried" });
      g.globalAlpha = a; g.strokeStyle = C.red; g.lineWidth = 8;
      const r0 = (t * 2) % (Math.PI * 2);
      g.beginPath(); g.arc(640, 310, 115, r0, r0 + Math.PI * 1.5); g.stroke();
      g.globalAlpha = 1;
      title("一回きり ではなく くり返し", "くり返し", W / 2, 90, 52, a);
    } else {
      title("これは「診断」ではありません", "診断", W / 2, 300, 62, fadeIn(s, 5, t));
      if (i >= 6) text("いくつも重なるなら、少しだけ立ち止まってみる", W / 2, 400, 34, C.grey, 500);
    }
  },
  sorry(s, t) {
    if (card(s, t)) return; header(s, t); floor();
    const i = lineAt(s, t);
    figure(640, 600, 1, { t, pose: i >= 1 ? "bow" : "stand", mood: "worried" });
    const n = i < 0 ? 0 : Math.min(14, 1 + Math.floor((t - s.lines[0].start) * 1.6));
    for (let k = 0; k < n; k++) {
      const ang = k * 2.4, r = 200 + (k % 3) * 60;
      bubble("すみません", 640 + Math.cos(ang) * r * 1.3, 330 + Math.sin(ang) * r * 0.55, 24, 0.9 - k * 0.04, k % 2 ? "left" : "right");
    }
  },
  memory(s, t) {
    if (card(s, t)) return; header(s, t); floor();
    const i = lineAt(s, t);
    if (i < 3) {
      figure(360, 600, 1, { t, pose: "point", color: C.grey, hair: true, mood: "stern" });
      figure(900, 600, 1, { t, pose: i >= 2 ? "think" : "stand", flip: true, mood: "worried", marks: i >= 2 });
      bubble("その日、空いてるって言ったよね", 830, 200, 28, fadeIn(s, 1, t), "right");
      bubble("え、言ってないけど？", 430, 290, 30, fadeIn(s, 1, t, 2.2));
      if (i >= 2) text("？", 1030, 150, 70, C.red);
    } else {
      // あとでトークを見返す
      floor();
      figure(470, 600, 1, { t, pose: "phone", mood: "worried" });
      const a = fadeIn(s, 3, t);
      g.globalAlpha = a;
      g.fillStyle = C.grey; rrect(700, 160, 260, 420, 28); g.fill();
      g.fillStyle = "#111"; rrect(715, 185, 230, 370, 16); g.fill();
      g.fillStyle = C.white; rrect(730, 230, 150, 40, 14); g.fill(); text("今週どう？", 805, 250, 18, C.ink);
      g.fillStyle = "#7bd88f"; rrect(780, 290, 150, 40, 14); g.fill(); text("土曜は空いてるよ", 855, 310, 17, C.ink);
      g.strokeStyle = C.red; g.lineWidth = 6; rrect(770, 280, 170, 60, 16); g.stroke();
      text("やっぱり言ってた", 830, 400, 26, C.red);
      g.globalAlpha = 1;
    }
  },
  simulate(s, t) {
    if (card(s, t)) return; header(s, t); floor();
    const i = lineAt(s, t);
    if (i === 2) {
      // 玄関のドアの前で
      g.fillStyle = "#2a2d35"; rrect(700, 230, 220, 370, 6); g.fill();
      g.fillStyle = C.grey; g.beginPath(); g.arc(890, 420, 10, 0, Math.PI * 2); g.fill();
      figure(560, 600, 1, { t, pose: "slump", mood: "worried" });
      bubble("ふぅ…", 470, 250, 32, fadeIn(s, 2, t, 1.0), "right");
      return;
    }
    figure(640, 600, 1, { t, pose: "think", mood: "worried" });
    const labels = ["今日は機嫌いいかな", "この言い方なら…", "怒らないかな…"];
    [[330, 280], [640, 230], [950, 280]].forEach(([x, y], k) => {
      const a = i >= 0 ? ease((t - s.lines[0].start - k * 0.8) / 0.5) : 0;
      thought(x, y, 100, a);
      g.globalAlpha = a; text(labels[k], x, y, 24, C.ink); g.globalAlpha = 1;
    });
    if (i >= 3) { g.strokeStyle = C.white; g.lineWidth = 5; for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(560 + k * 50, 300); g.lineTo(570 + k * 50, 330); g.stroke(); } }
  },
  feelings(s, t) {
    if (card(s, t)) return; header(s, t); floor();
    const i = lineAt(s, t);
    figure(360, 600, 1, { t, pose: "point", color: C.grey, hair: true, mood: "stern" });
    figure(900, 600, 1, { t, pose: "slump", flip: true, mood: "worried" });
    bubble("気にしすぎ", 430, 330, 32, fadeIn(s, 0, t, 1.5));
    bubble("被害妄想", 600, 255, 32, fadeIn(s, 0, t, 2.5));
    bubble("冗談なのに", 380, 180, 30, fadeIn(s, 1, t));
    bubble("そんなことで怒る？", 700, 170, 28, fadeIn(s, 1, t, 1.5));
    const sc = i >= 2 ? lerp(1, 0.35, ease(since(s, 2, t) / 4)) : 1;
    heart(900, 290, sc, C.red);
  },
  explain(s, t) {
    if (card(s, t)) return; header(s, t); floor();
    const i = lineAt(s, t);
    // 外ではいい人
    const glowA = 0.5 + 0.3 * Math.sin(t * 3);
    g.globalAlpha = glowA; text("✦", 320, 300, 34, C.warm); text("✦", 470, 320, 26, C.warm); g.globalAlpha = 1;
    figure(400, 600, 1, { t, pose: "open", color: C.grey, hair: true, mood: "happy" });
    figure(640, 600, 0.85, { t, flip: true, color: C.dim, mood: "happy" });
    figure(980, 600, 0.95, { t, flip: true, pose: i >= 2 ? "slump" : "stand", mood: "worried" });
    if (i >= 1) bubble("優しそうな人なのに", 700, 230, 30, fadeIn(s, 1, t), "left", C.grey);
    if (i >= 2) { g.globalAlpha = fadeIn(s, 2, t); g.strokeStyle = C.red; g.lineWidth = 6; g.beginPath(); g.moveTo(940, 240); g.lineTo(1020, 240); g.stroke(); text("話すのをやめた", 980, 200, 26, C.red); g.globalAlpha = 1; }
  },
  evidence(s, t) {
    if (card(s, t)) return; header(s, t); floor();
    const i = lineAt(s, t);
    figure(400, 600, 1, { t, pose: "write", mood: "worried" });
    const items = [[620, "スクショ"], [820, "手帳"], [1020, "ボイスメモ"]];
    items.forEach(([x, lab], k) => {
      const a = i >= 1 ? ease((t - s.lines[1].start - k * 0.9) / 0.5) : 0;
      g.globalAlpha = a;
      if (k === 0) { g.fillStyle = C.grey; rrect(x - 50, 260, 100, 180, 14); g.fill(); g.fillStyle = "#111"; rrect(x - 40, 275, 80, 150, 8); g.fill(); g.fillStyle = "#7bd88f"; rrect(x - 30, 300, 55, 20, 6); g.fill(); g.fillStyle = C.white; rrect(x - 25, 330, 55, 20, 6); g.fill(); }
      if (k === 1) { g.fillStyle = C.white; rrect(x - 70, 260, 140, 180, 8); g.fill(); g.fillStyle = C.ink; for (let r = 0; r < 4; r++) g.fillRect(x - 50, 310 + r * 28, 90, 5); text("10/24", x - 15, 285, 20, C.red); }
      if (k === 2) { g.fillStyle = C.white; rrect(x - 25, 280, 50, 90, 25); g.fill(); g.strokeStyle = C.white; g.lineWidth = 6; g.beginPath(); g.arc(x, 345, 45, 0.2, Math.PI - 0.2); g.stroke(); g.beginPath(); g.moveTo(x, 390); g.lineTo(x, 430); g.stroke(); g.fillStyle = C.red; g.beginPath(); g.arc(x + 40, 270, 10, 0, Math.PI * 2); g.fill(); }
      text(lab, x, 480, 26, C.white);
      g.globalAlpha = 1;
    });
    if (i >= 2) title("自分を確かめたいだけ", "確かめたい", W / 2, 165, 40, fadeIn(s, 2, t));
  },
  past(s, t) {
    if (card(s, t)) return; header(s, t); floor();
    const i = lineAt(s, t);
    const fade = i >= 2 ? 1 - ease(since(s, 2, t) / 3) * 0.85 : 1;
    const gr = g.createRadialGradient(420, 400, 0, 420, 400, 260);
    gr.addColorStop(0, `rgba(255,210,122,${0.25 * fade})`); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(140, 120, 560, 520);
    figure(420, 600, 1, { t, pose: "open", mood: "happy", alpha: fade });
    figure(860, 600, 1, { t, pose: "slump", flip: true, mood: "worried" });
    g.globalAlpha = fade; text("前の自分", 420, 330, 30, C.warm); g.globalAlpha = 1;
    text("いまの自分", 860, 330, 30, C.grey);
  },
  decide(s, t) {
    if (card(s, t)) return; header(s, t); floor();
    const i = lineAt(s, t);
    figure(640, 600, 1, { t, pose: "phone", mood: "worried" });
    g.fillStyle = C.grey; rrect(700, 440, 34, 60, 6); g.fill();
    g.fillStyle = "#cfe6ff"; rrect(705, 446, 24, 44, 4); g.fill();
    ["今日の夕飯", "週末の予定", "実家に帰る？"].forEach((q, k) => {
      const a = i >= 1 ? ease((t - s.lines[1].start - k * 0.6) / 0.4) : 0;
      bubble(q, 300 + k * 340, 230 - (k % 2) * 50, 28, a, "left", C.grey);
    });
    bubble("これでいいかな？", 840, 360, 30, fadeIn(s, 2, t), "left");
  },
  after(s, t) {
    const i = lineAt(s, t);
    const gr = g.createRadialGradient(W / 2, H, 0, W / 2, H, 800);
    gr.addColorStop(0, "rgba(255,210,122,0.18)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    if (i <= 3) {
      floor();
      figure(640, 600, 1, { t, pose: i >= 2 ? "stand" : "slump", mood: i >= 2 ? undefined : "worried" });
      if (i >= 2) title("あなたが感じたことは、あなたのもの", "あなたのもの", W / 2, 110, 54, fadeIn(s, 2, t));
    } else {
      title("できることは、小さくていい", "小さくていい", W / 2, 140, 54, fadeIn(s, 4, t));
      [["1", "あったことを、日付と一緒にメモしておく", 5], ["2", "信頼できる人に、ひとりでいいから話してみる", 6]].forEach(([n, str, li], k) => {
        const a = fadeIn(s, li, t);
        g.globalAlpha = a; text(n, 190, 290 + k * 110, 60, C.red); text(str, 250, 290 + k * 110, 40, C.white, 900, "left"); g.globalAlpha = 1;
      });
    }
  },
  outro(s, t) {
    title("あなたの記憶は、あなたのもの。", "あなたのもの", W / 2, 300, 62, fadeIn(s, 0, t, 0.8));
    g.globalAlpha = fadeIn(s, 1, t, 0.8);
    text("※この動画は医療的な診断を目的としたものではありません。", W / 2, 420, 22, C.grey, 500);
    g.globalAlpha = 1;
  },
};

window.renderFrame = function (t) {
  const s = sceneAt(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  S[s.visual](s, t);
  subtitle(s, t);
  const f = Math.min(clamp(t / 1.0), clamp((TL.duration - t) / 1.2));
  if (f < 1) { g.fillStyle = `rgba(0,0,0,${1 - f})`; g.fillRect(0, 0, W, H); }
};
window.renderThumb = function (variant) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  if (variant === "a") {
    title("それ、ガスライティングかも", "ガスライティング", W / 2, 110, 88);
    figure(470, 680, 1.25, { t: 0.5, pose: "point", color: C.white, hair: true, mood: "stern" });
    figure(860, 680, 1.25, { t: 0.5, pose: "shrink", flip: true, mood: "worried", marks: true });
    bubble("また被害妄想？", 560, 270, 40);
    arrow(1080, 260, 960, 380);
  } else {
    title("8つのサイン", "8つ", W / 2, 110, 100);
    figure(640, 680, 1.3, { t: 0.5, pose: "bow", mood: "worried" });
    for (let k = 0; k < 7; k++) bubble("すみません", 640 + Math.cos(k * 2.4) * 380, 380 + Math.sin(k * 2.4) * 150, 34, 0.95);
  }
};
window.init = async function (timeline) {
  TL = timeline;
  await document.fonts.load("900 40px NotoJP");
  await document.fonts.load("500 40px NotoJP");
  return true;
};
</script>
